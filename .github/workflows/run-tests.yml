name: run-tests

on:
  push:
    paths:
      - "**.php"
      - ".github/workflows/run-tests.yml"
      - "phpunit-ci.xml.dist"
      - "composer.json"
      - "composer.lock"
  pull_request:
  workflow_dispatch:
  # Upstream releases (e.g. Laravel 13.42 changing Collection::wrap()) can
  # break this package without any push here - test the newest versions weekly.
  schedule:
    - cron: "17 4 * * 1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      # Let every combination finish, so one failure shows which versions break.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: [8.4]
        laravel: [13.*, 12.*, 11.*, 10.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*
            carbon: ^3.8.4
          # Newest PHP against the newest Laravel 13.x release.
          - os: ubuntu-latest
            php: 8.5
            laravel: 13.*
            stability: prefer-stable
            testbench: 11.*
            carbon: ^3.8.4
          - laravel: 12.*
            testbench: 10.*
            carbon: ^3.8.4
          - laravel: 11.*
            testbench: 9.*
            carbon: ^2.73.0
          - laravel: 10.*
            testbench: ^8.22
            carbon: ^2.73.0

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo, ffi
          ini-values: ffi.enable=true
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      # composer.lock is not committed, and "composer update" re-resolves from
      # scratch anyway - so prefer-stable always gets the newest release of
      # each Laravel major, never a stale lock.
      - name: Install dependencies
        run: |
          rm -f composer.lock
          # Composer blocks releases with open security advisories, which by now covers
          # every (end-of-life) Laravel 10.x release and old prefer-lowest versions. This
          # job only tests compatibility, so allow them here.
          composer config --no-plugins policy.advisories.block false
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "nesbot/carbon:${{ matrix.os == 'windows-latest' && '^^^' || '' }}${{ matrix.carbon }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: |
          composer show -D
          composer show laravel/framework | grep -E '^versions'

      - name: Execute tests
        run: vendor/bin/pest --ci
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: test_db
          MYSQL_USER: root
          MYSQL_PASSWORD: root
